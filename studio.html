<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Studio</title>
<style>
:root{--bg:#0e0e10;--panel:#17171a;--panel2:#1f1f23;--panel3:#29292e;--line:#2b2b30;--ink:#ececf0;--muted:#9494a0;
  --accent:#23d4c4;--accent-ink:#03110f;--violet:#8b7bff;--warn:#f5b347}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
body{display:grid;grid-template-rows:54px minmax(0,1fr) 296px;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel3);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;min-height:30px;white-space:nowrap}
button:hover:not(:disabled){border-color:#4a4a52}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=search],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-height:30px}
input[type=range]{accent-color:var(--accent);width:100%}
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-weight:750;font-size:15px;margin-right:6px;white-space:nowrap}
.brand b{color:var(--accent)}
#proj{max-width:250px;min-width:60px;flex:0 1 250px}
#pname{width:240px;min-width:60px;flex:0 1 240px}
#fmtSel,#fillSel,#expFmt,#expQ{max-width:112px}
@media (max-width:1500px){#fmtSel,#fillSel,#expFmt,#expQ{max-width:96px}#saveState{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
header>button,header>select,header>a,header>.pill{flex-shrink:0}
.spacer{flex:1}
.pill{font-size:12px;color:var(--muted);padding:3px 10px;border-radius:999px;background:var(--panel2);white-space:nowrap}
.pill.on{color:var(--accent)}
.lbl{color:var(--muted);font-size:12px}
#app{display:grid;grid-template-columns:330px minmax(0,1fr) 320px;min-height:0}
#app.inspClosed{grid-template-columns:330px minmax(0,1fr) 38px}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0}
#lib{border-right:1px solid var(--line)}
#inspCol{border-left:1px solid var(--line)}
#inspHead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}
#inspToggle{min-height:26px;padding:2px 9px}
#insp{flex:1;min-height:0;overflow-y:auto}
#app.inspClosed #insp{display:none}
#app.inspClosed #inspHead{flex-direction:column;border:0;padding:8px 0;height:100%;cursor:pointer}
#app.inspClosed #inspTitle{writing-mode:vertical-rl;letter-spacing:.06em}
/* colour looks */
#lookBtn{display:inline-flex;align-items:center;gap:6px}
#lookPop{position:fixed;z-index:60;width:600px;max-width:calc(100vw - 16px);max-height:calc(100vh - 70px);overflow:auto;background:var(--panel);border:1px solid #3a3a42;border-radius:12px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
#lookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.lk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;background:transparent;border:2px solid transparent;border-radius:9px;min-height:0}
.lk canvas{width:58px;height:103px;border-radius:5px;background:#000;display:block}
.lk span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.lk:hover{border-color:#4a4a52}
.lk.on{border-color:var(--accent)}
.lk.on span{color:var(--ink)}
#adjPane h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
#adjPane h4:first-child{margin-top:4px}
.adj{display:grid;grid-template-columns:118px 1fr 46px;gap:10px;align-items:center;margin:4px 0}
.adj .lbl{cursor:default}
.adj .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right}
.adj input.hue{-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.adj input.hue::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #000}
.slot .lk1{position:absolute;right:3px;top:2px;font-size:11px;background:rgba(0,0,0,.7);padding:0 3px;border-radius:3px}
/* full screen reel */
.ovbtn{position:absolute;right:8px;top:8px;min-height:0;width:32px;height:32px;padding:0;border-radius:8px;background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.25);font-size:17px;z-index:3}
#fsBar{display:none}
#cvWrap.fs{display:flex;align-items:center;justify-content:center;background:#000;border-radius:0;box-shadow:none}
#cvWrap.pseudo{position:fixed;inset:0;z-index:90;width:100vw;height:100vh;aspect-ratio:auto}
#cvWrap.fs canvas{height:100vh;width:auto;aspect-ratio:var(--ar,9/16);max-width:100vw;max-height:100vh;object-fit:contain;cursor:pointer}
#cvWrap{aspect-ratio:var(--ar,9/16)}
#cvWrap.sized{flex:none;aspect-ratio:auto}
#cvWrap.fs .tag,#cvWrap.fs #fsBtn{display:none}
#cvWrap.fs #fsBar{display:flex;align-items:center;gap:10px;position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(620px,92vw);padding:8px 12px;border-radius:12px;background:rgba(20,20,24,.82);transition:opacity .3s}
#cvWrap.fs.idle #fsBar{opacity:0}
#cvWrap.fs.idle,#cvWrap.fs.idle canvas{cursor:none}
#fsProg{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.2);cursor:pointer;position:relative}
#fsFill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
#fsTime{font-variant-numeric:tabular-nums;color:#ddd;font-size:12px;min-width:100px;text-align:right}
/* text editor bubble */
#txEdit{position:fixed;z-index:70;width:340px;background:var(--panel);border:1px solid #4a4a52;border-radius:12px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
#txEdit textarea{font-size:16px;min-height:40px;resize:none;overflow:hidden}
.swatches{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sw{width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:2px solid #0e0e10;box-shadow:0 0 0 1px #4a4a52}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.def{position:relative;font-size:10px;font-weight:800;color:#000;line-height:18px}
.swatches input[type=color]{width:26px;height:24px;padding:0;border:0;background:transparent;cursor:pointer}
/* photos */
.clipbox img{width:100%;height:100%;object-fit:contain;display:block}
.pvpart{display:flex;align-items:center;gap:8px;flex:none;min-height:26px}
.pvpart .lbl b{color:var(--accent);font-weight:650}
.lib-head{padding:10px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel3);border:1px solid transparent;cursor:pointer;min-height:0;line-height:1.5}
.chip[aria-pressed=true]{background:var(--violet);color:#fff}
.chip.tog[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel2);padding:4px 10px;min-height:28px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
#libGrid{flex:1;min-height:0;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px;gap:8px;align-content:start}
.card{position:relative;height:150px;border-radius:7px;overflow:hidden;background:#000;cursor:pointer;outline:2px solid transparent;outline-offset:-2px}
.card:hover{outline-color:var(--accent)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{position:absolute;font-size:10.5px;background:rgba(0,0,0,.72);padding:1px 5px;border-radius:3px;pointer-events:none}
.card .d{right:4px;bottom:4px}
.card .o{left:4px;bottom:4px}
.card .u{left:4px;top:4px;background:var(--violet)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 20px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .12s;pointer-events:none}
.card:hover .cap{opacity:1}
.libfoot{grid-column:1/-1;text-align:center;color:var(--muted);padding:6px;align-self:start}
#stage{display:flex;flex-direction:column;min-height:0;padding:12px 12px 8px;gap:8px}
.screens{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;gap:18px}
.screen{height:100%;aspect-ratio:9/16;position:relative;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line)}
.screen canvas,.screen video{width:100%;height:100%;display:block;object-fit:cover}
.screen .tag{position:absolute;left:8px;top:8px;font-size:11px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:4px;pointer-events:none}
[hidden]{display:none !important}
.side{flex:0 1 560px;min-width:230px;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.tabs{display:flex;gap:5px;flex:none}
.tabs button{min-height:28px;padding:3px 13px;border-radius:999px;background:var(--panel2)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sidebody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#origWrap{height:100%}
.clipview{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.clipbox{position:relative;flex:1;min-height:0;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.clipbox video{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.guide{position:absolute;border:1.5px dashed rgba(255,255,255,.8);box-shadow:0 0 0 9999px rgba(0,0,0,.38);pointer-events:none}
.guide span{position:absolute;left:5px;top:5px;font-size:10px;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:3px;white-space:nowrap}
.pvmsg{position:absolute;left:0;right:0;bottom:14px;text-align:center;pointer-events:none}
.pvmsg span{font-size:12px;color:var(--accent);background:rgba(0,0,0,.75);padding:4px 10px;border-radius:6px}
.pvbar{display:flex;align-items:center;gap:8px;flex:none}
.pvscrub{position:relative;flex:1;height:34px;border-radius:6px;background:var(--panel2);cursor:pointer;overflow:hidden;touch-action:none}
.pvthumbs{position:absolute;inset:0;display:flex;opacity:.55;pointer-events:none}
.pvthumbs img{flex:1;min-width:0;height:100%;object-fit:cover}
.pvwin{position:absolute;top:0;bottom:0;min-width:6px;background:rgba(35,212,196,.32);border:2px solid var(--accent);border-radius:4px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.pvhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none}
#pvTime{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:92px;text-align:right}
.pvfoot{display:flex;align-items:center;gap:8px;flex:none}
.pvinfo{flex:1;min-width:0}
.pvinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvinfo .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .add{position:absolute;right:4px;top:4px;width:28px;height:28px;min-height:0;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-weight:800;font-size:17px;line-height:26px;opacity:0;transition:opacity .12s}
.card:hover .add,.card.pv .add{opacity:1}
.card.pv{outline-color:#fff}
#cv{cursor:grab;touch-action:none}
#cv.fit{cursor:default}
.controls{display:flex;justify-content:center;align-items:center;gap:8px}
#time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:130px;text-align:center}
.playbtn{width:42px;height:42px;border-radius:50%;padding:0;font-size:15px}
.hint{color:var(--muted);font-size:11.5px;margin:6px 0 0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.shot-title{font-size:16px;font-weight:650}
.meta{color:var(--muted);font-size:12px}
.strip{position:relative;height:60px;border-radius:6px;background:#000 0 0/100% 100% no-repeat;cursor:pointer;overflow:hidden;display:flex}
.strip img{flex:1;min-width:0;height:100%;object-fit:cover}
.strip .win{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-radius:5px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);cursor:grab}
.kv{display:grid;grid-template-columns:78px 1fr;gap:8px 10px;align-items:center}
.cmp{display:flex;gap:12px;align-items:center;margin-top:10px}
.cmp canvas{width:72px;height:128px;border-radius:5px;background:#000;flex:none}
.warn{color:var(--warn);font-size:12px;margin-top:6px}
footer{background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-rows:40px minmax(0,1fr);min-height:0}
.tbar{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
.tbar label{display:inline-flex;align-items:center;gap:6px}
#tlScroll{overflow:auto;position:relative}
#tl{position:relative;margin:0 18px;min-height:100%;min-width:100px}
#ruler{position:absolute;top:4px;left:0;height:24px;cursor:pointer}
#vtrack{position:absolute;top:32px;left:0;height:88px}
#handles{position:absolute;top:32px;left:0;height:88px}
#ttrack{position:absolute;top:126px;left:0;height:28px}
#wave{position:absolute;top:160px;left:0;height:46px;cursor:pointer}
.slot.drop{border-color:var(--warn);box-shadow:inset 0 0 0 3px var(--warn)}
.slot.drop::after{content:'Drop to replace';position:absolute;inset:auto 0 4px 0;text-align:center;font-size:11px;font-weight:650;color:var(--warn);text-shadow:0 1px 2px #000}
#cvWrap.drop{box-shadow:0 0 0 3px var(--warn)}
textarea{width:100%;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:inherit;font:15px/1.35 "Segoe UI",system-ui,sans-serif}
#playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:6}
#playhead::before{content:'';position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #fff}
.slot{position:absolute;top:0;height:88px;border-radius:6px;overflow:hidden;background:#2b2b30 left center/auto 100% repeat-x;border:2px solid #0e0e10;cursor:pointer}
.slot.sel{border-color:var(--accent);z-index:2}
.slot .n{position:absolute;left:4px;top:3px;font-size:10.5px;background:rgba(0,0,0,.7);padding:0 5px;border-radius:3px}
.slot .ld{position:absolute;left:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.75);padding:0 4px;border-radius:3px;color:var(--accent)}
.handle{position:absolute;top:0;height:88px;width:14px;margin-left:-7px;cursor:ew-resize;z-index:4}
.handle::after{content:'';position:absolute;left:5px;top:24px;bottom:24px;width:4px;border-radius:2px;background:rgba(255,255,255,.6)}
.handle:hover::after,.handle.drag::after{background:var(--accent)}
.tx{position:absolute;height:24px;border-radius:5px;background:#352b6e;color:#ddd6ff;font-size:11px;padding:4px 13px;white-space:nowrap;overflow:hidden;cursor:grab;border:1px solid #0e0e10;user-select:none;display:flex;gap:6px}
.tx .tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tx .dur{flex:none;opacity:.65;font-size:10px;font-variant-numeric:tabular-nums}
.tx.narrow .dur{display:none}
.tx:hover{background:#43369a}
.tx.sel{background:var(--violet);color:#fff;border-color:#fff;z-index:2}
.tx .eL,.tx .eR{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;background:rgba(255,255,255,.13)}
.tx .eL{left:0;border-radius:4px 0 0 4px}.tx .eR{right:0;border-radius:0 4px 4px 0}
.tx .eL::after,.tx .eR::after{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:2px;border-radius:1px;background:rgba(255,255,255,.55)}
.tx .eL:hover,.tx .eR:hover,.tx.sel .eL,.tx.sel .eR{background:rgba(255,255,255,.34)}
.track-lbl{position:absolute;left:-16px;font-size:9px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg)}
#toast{position:fixed;left:50%;bottom:286px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;
  display:none;align-items:center;gap:10px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast button{background:transparent;color:var(--bg);border-color:rgba(0,0,0,.25);min-height:26px;padding:2px 9px}
#busy{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand">Reel <b>Studio</b></div>
  <select id="proj" aria-label="Project"></select>
  <input type="text" id="pname" aria-label="Reel name" title="Reel name (also the exported file name)">
  <button id="lookBtn" title="Colour look for the whole reel">🎨 <span id="lookName">Natural</span> ▾</button>
  <select id="fmtSel" aria-label="Format" title="Shape of the reel, in the preview and the export"></select>
  <select id="fillSel" aria-label="Fill" title="How clips fill the frame (all shots; a shot can choose its own in its details)"></select>
  <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
  <button id="dup" title="Make a copy of this reel to experiment with">Duplicate</button>
  <button id="del" title="Delete this project">Delete</button>
  <span class="spacer"></span>
  <span class="pill" id="saveState">Saved</span>
  <span class="pill" id="renderState" hidden></span>
  <select id="expFmt" aria-label="Export format" title="Export in this shape (the reel itself doesn't change)"></select>
  <select id="expQ" aria-label="Export quality" title="Export quality. Clips are cut from your original (mostly 4K) files, so 2K keeps detail that 1080p loses. Sharpened = gentle extra crispness that survives Instagram's compression.">
    <option value="std">1080p</option>
    <option value="sharp">1080p · sharpened</option>
    <option value="2k">2K · sharpened</option>
    <option value="4k">4K · sharpened</option>
  </select>
  <button class="primary" id="export">Export reel</button>
  <a href="/carousel" title="Open Carousel Studio" style="color:var(--muted);text-decoration:none;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap">Carousels →</a>
</header>

<div id="app">
  <aside id="lib">
    <div class="lib-head">
      <select id="colSel" aria-label="Folder" title="Which footage folder the library shows (Europe trip, House Party 02…). ＋ Add a folder… brings in a new one."></select>
      <div class="row" style="flex-wrap:nowrap">
        <input type="search" id="q" placeholder="Search clips: sunset, cat, train…" style="flex:1;min-width:0">
        <button id="filtBtn" class="chip" style="flex:none;min-height:30px;padding:2px 10px" title="Show or hide the filters (place, shape, tags…)" aria-expanded="false">⚙ Filters</button>
      </div>
      <div id="libFilters" hidden style="display:flex;flex-direction:column;gap:7px">
      <div class="row">
        <select id="loc" style="flex:1;min-width:0"></select>
        <div class="seg" id="orient"><button data-v="all" aria-pressed="true">All</button><button data-v="portrait" aria-pressed="false" title="Portrait">▯</button><button data-v="landscape" aria-pressed="false" title="Landscape">▭</button></div>
      </div>
      <div class="seg" id="kind" style="align-self:flex-start"><button data-v="all" aria-pressed="true">Videos &amp; photos</button><button data-v="video" aria-pressed="false">🎬 Videos</button><button data-v="photo" aria-pressed="false">📷 Photos</button></div>
      <div class="chips" id="tagChips"></div>
      <div class="chips">
        <button class="chip tog" id="fits" aria-pressed="true" title="Only clips at least as long as the selected shot">Long enough</button>
        <button class="chip tog" id="hideBad" aria-pressed="true">Hide unusable</button>
        <button class="chip tog" id="usedOnly" aria-pressed="false">Used in this reel</button>
        <label class="lbl" style="display:inline-flex;align-items:center;gap:4px"><input type="checkbox" id="autoNext"> Next shot after picking</label>
      </div>
      </div>
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="lbl" id="libCount" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        <button id="warm" class="chip" style="flex:none" title="Make preview copies for every clip in this list in the background, so they play instantly">⚡ Instant previews</button></div>
    </div>
    <div id="libGrid"></div>
  </aside>

  <section id="stage">

    h += `<h4>Effects · whole reel</h4>` + FX.map(([k, lbl]) => `<div class="adj"><span class="lbl" title="Double-click to reset">${lbl}</span><input type="range" data-fx="${k}" min="0" max="1" step="0.01"><span class="v" data-vfx="${k}"></span></div>`).join('');
    return h + `<div class="row" style="margin-top:12px"><button id="adjReset">Reset sliders</button><button id="fxReset">Reset effects</button></div>`;
  })();
  renderLookGrid(); syncLookPop();
  const b = $('#lookBtn').getBoundingClientRect(), cr = cvWrap.getBoundingClientRect();   // beside the reel, so you can watch it change
  pop.style.top = (b.bottom + 6) + 'px'; pop.style.left = clamp(cr.right + 14, 8, innerWidth - pop.offsetWidth - 8) + 'px';
  pop.style.maxHeight = Math.max(320, $('footer').getBoundingClientRect().top - b.bottom - 14) + 'px';   // keep the timeline free
  $('#adjReset').onclick = () => { pushHist(); writeC({adj: {}}); colourChanged(true); };
  $('#fxReset').onclick = () => { pushHist(); S.p.fx = {}; colourChanged(true); };
}
function renderLookGrid() {
  const cur = readC().grade;
  $('#lookGrid').innerHTML = lookList.filter(L => LK.cat === 'All' || L.group === LK.cat).map(L =>
    `<button class="lk ${L.key === cur ? 'on' : ''}" data-k="${L.key}" title="${esc(L.label)} · ${esc(L.group)}"><canvas width="116" height="206"></canvas><span>${esc(L.label)}</span></button>`).join('');
  queueThumbs();
}
// put every control in the colour panel in step with the reel / shot being coloured
function syncLookPop() {
  if ($('#lookPop').hidden) return;
  const C = readC(), s = S.p.slots[S.sel], n = S.sel + 1;
  $('#lookTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === LK.tab));
  $('#lookScope').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === LK.scope));
  $('#lookScope [data-v="shot"]').textContent = `Shot ${n} only`;
  $('#lookPane').hidden = LK.tab !== 'looks'; $('#adjPane').hidden = LK.tab !== 'adjust';
  const note = LK.scope === 'shot'
    ? (s.look ? `<span class="meta" style="flex:1">Shot ${n} has its own colour.</span><button id="lkUseReel">Use the reel’s colour</button><button id="lkToAll" title="Make this the colour of the whole reel">Use for whole reel</button>`
              : `<span class="meta">Changes here only colour shot ${n}.</span>`)
    : `<span class="meta">Colours every shot${S.p.slots.some(x => x.look) ? ' (except shots with their own colour 🎨)' : ''}. Hover a look to try it.</span>`;
  if ($('#lookNote').dataset.h !== note) {
    $('#lookNote').innerHTML = note; $('#lookNote').dataset.h = note;
    const ur = $('#lkUseReel'); if (ur) ur.onclick = () => { pushHist(); delete S.p.slots[S.sel].look; colourChanged(true); renderLookGrid(); };
    const ta = $('#lkToAll'); if (ta) ta.onclick = () => { pushHist(); const L = S.p.slots[S.sel].look; S.p.grade = L.grade; S.p.grade_amt = L.amt; S.p.adj = {...L.adj}; delete S.p.slots[S.sel].look; LK.scope = 'reel'; colourChanged(true); renderLookGrid(); };
  }
  if (document.activeElement !== $('#lookAmt')) $('#lookAmt').value = C.amt ?? 1;
  $('#lookAmtV').textContent = Math.round((C.amt ?? 1) * 100) + '%';
  document.querySelectorAll('#lookGrid .lk').forEach(x => x.classList.toggle('on', x.dataset.k === C.grade));
  const a = C.adj || {}, fx = S.p.fx || {};
  document.querySelectorAll('#adjPane input[data-k]').forEach(el => {
    const k = el.dataset.k, v = +a[k] || 0;
    if (document.activeElement !== el) el.value = v;
    const out = document.querySelector(`#adjPane [data-v="${k}"]`);
    out.textContent = k.endsWith('h') ? Math.round(v) + '°' : (k === 'sta' || k === 'hia' || k === 'fade') ? Math.round(v * 100 / (k === 'fade' ? 0.25 : 1)) + '%' : (v > 0 ? '+' : '') + Math.round(v * 100);
  });
  document.querySelectorAll('#adjPane input[data-fx]').forEach(el => {
    const v = +fx[el.dataset.fx] || 0; if (document.activeElement !== el) el.value = v;
    document.querySelector(`#adjPane [data-vfx="${el.dataset.fx}"]`).textContent = Math.round(v * 100) + '%';
  });
}
function closeLookPop() { $('#lookPop').hidden = true; if (S.hoverLook) { S.hoverLook = null; paint(S.frame); } }
function drawLookThumbs() {
  if (!GLT || !S.p || $('#lookPop').hidden || LK.tab !== 'looks') return;
  const k = LK.scope === 'shot' ? S.sel : slotAt(S.frame), f = LK.scope === 'shot' && slotAt(S.frame) !== k ? bounds()[k] : S.frame;
  const info = slotSource(k, f); if (!info) return;
  const s = S.p.slots[k], m = moveAt(k, f), C = readC();
  document.querySelectorAll('#lookGrid .lk').forEach(btn => {
    glDraw(GLT, info.src, info.sw, info.sh, s, {grade: btn.dataset.k, amt: C.amt || 1, adj: C.adj}, m, null);
    btn.querySelector('canvas').getContext('2d').drawImage(GLT.canvas, 0, 0);
  });
}
$('#lookBtn').onclick = () => $('#lookPop').hidden ? openLookPop() : closeLookPop();
$('#lookTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LK.tab = b.dataset.v; syncLookPop(); queueThumbs(); });
$('#lookScope').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  LK.scope = b.dataset.v;
  if (LK.scope === 'shot' && slotAt(S.frame) !== S.sel) showFrame(bounds()[S.sel]);
  renderLookGrid(); syncLookPop();
});
$('#lookCats').addEventListener('click', e => {
  const b = e.target.closest('[data-c]'); if (!b) return;
  LK.cat = b.dataset.c; $('#lookCats').querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); renderLookGrid();
});
$('#lookGrid').addEventListener('click', e => {
  const b = e.target.closest('.lk'); if (!b) return;
  pushHist(); S.hoverLook = null;
  writeC({grade: b.dataset.k, amt: readC().amt || 1});
  colourChanged(true);
});
$('#lookGrid').addEventListener('mouseover', e => { const b = e.target.closest('.lk'); if (b && S.hoverLook !== b.dataset.k) { S.hoverLook = b.dataset.k; paint(S.frame); } });
$('#lookGrid').addEventListener('mouseleave', () => { S.hoverLook = null; paint(S.frame); });
$('#lookAmt').addEventListener('input', e => {
  if (!lkHist) { pushHist(); lkHist = true; }
  writeC({amt: +(+e.target.value).toFixed(2)}); colourChanged(false);
});
$('#adjPane').addEventListener('input', e => {
  const el = e.target; if (!el.matches('input[type=range]')) return;
  if (!lkHist) { pushHist(); lkHist = true; }
  const v = +(+el.value).toFixed(3);
  if (el.dataset.k) { const a = {...(readC().adj || {})}; if (v) a[el.dataset.k] = v; else delete a[el.dataset.k]; writeC({adj: a}); }
  else { const fx = {...(S.p.fx || {})}; if (v) fx[el.dataset.fx] = v; else delete fx[el.dataset.fx]; S.p.fx = fx; }
  colourChanged(false);
});
$('#adjPane').addEventListener('dblclick', e => {           // double-click a slider's name to reset it
  const row = e.target.closest('.adj'); if (!row || !e.target.classList.contains('lbl')) return;
  const el = row.querySelector('input'); pushHist();
  if (el.dataset.k) { const a = {...(readC().adj || {})}; delete a[el.dataset.k]; writeC({adj: a}); }
  else { const fx = {...(S.p.fx || {})}; delete fx[el.dataset.fx]; S.p.fx = fx; }
  colourChanged(true);
});
for (const ev of ['change', 'pointerup']) $('#lookPop').addEventListener(ev, () => { if (lkHist) { lkHist = false; renderTimeline(); } });

// ------------------------------------------------------------------ full screen reel
const isFs = () => cvWrap.classList.contains('fs');
function setBig(on, pseudo) {                 // pseudo = fill the browser window when real full screen isn't allowed
  cvWrap.classList.toggle('fs', on); cvWrap.classList.toggle('pseudo', on && !!pseudo); cvWrap.classList.remove('idle');
  if (on) { cvWrap.classList.remove('sized'); cvWrap.style.width = cvWrap.style.height = ''; } else sizeScreen();
  sizeCanvas(on);                               // sharp picture on a big screen
  if (S.p) { paint(S.frame); updFsBar(); }
  if (on) fsWake();
}
function toggleFs() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (cvWrap.classList.contains('pseudo')) { setBig(false); return; }
  closeTextEditor(true); closeLookPop();
  let settled = false;
  const fallback = () => { if (!settled && !document.fullscreenElement) { settled = true; setBig(true, true); } };
  try { cvWrap.requestFullscreen().then(() => { settled = true; }, fallback); } catch (e) { fallback(); }
  setTimeout(fallback, 700);
}
let fsIdleT = 0;
function fsWake() { cvWrap.classList.remove('idle'); clearTimeout(fsIdleT); fsIdleT = setTimeout(() => { if (isFs() && S.playing) cvWrap.classList.add('idle'); }, 2200); }
function updFsBar() {
  if (!isFs() || !S.p) return;
  $('#fsFill').style.width = (S.frame / Math.max(1, S.T.total - 1) * 100) + '%';
  $('#fsTime').textContent = fmt(S.frame) + ' / ' + fmt(S.T.total);
  $('#fsPlay').textContent = S.playing ? '❚❚' : '▶';
}
document.addEventListener('fullscreenchange', () => setBig(document.fullscreenElement === cvWrap, false));
$('#fsBtn').onclick = toggleFs;
$('#fsExit').onclick = toggleFs;
$('#fsPlay').onclick = e => { e.stopPropagation(); toggle(); updFsBar(); fsWake(); };
cvWrap.addEventListener('pointermove', () => { if (isFs()) fsWake(); });
$('#fsProg').addEventListener('pointerdown', e => {
  e.stopPropagation();
  const r = $('#fsProg').getBoundingClientRect(), was = S.playing;
  stop(); showFrame(clamp((e.clientX - r.left) / r.width, 0, 1) * (S.T.total - 1)); updFsBar();
  if (was) play();
});

// ------------------------------------------------------------------ right-hand panel: hide / show
function setInsp(open) {
  $('#app').classList.toggle('inspClosed', !open);
  const b = $('#inspToggle'); b.textContent = open ? '⟩' : '⟨'; b.title = open ? 'Hide this panel' : 'Show shot and text details';
  try { localStorage.setItem('rs-insp', open ? 'open' : 'closed'); } catch (e) {}
  requestAnimationFrame(() => { layoutGuide(); if (S.p) renderTimeline(); });
}
$('#inspHead').addEventListener('click', e => {
  const closed = $('#app').classList.contains('inspClosed');
  if (closed || e.target.closest('#inspToggle')) setInsp(closed);
});
{ let st = null; try { st = localStorage.getItem('rs-insp'); } catch (e) {} setInsp(st === 'open'); }

// ------------------------------------------------------------------ export
async function exportReel() {
  stop(); await save();
  try { const r = await api('/api/render', {id:S.p.id, format: $('#expFmt').value || undefined, quality: $('#expQ').value}); if (!r.ok) { toast(esc(r.msg)); return; } }
  catch (e) { toast('Could not start export: ' + esc(e.message)); return; }
  $('#export').disabled = true; pollRender();
}
function pollRender() {
  api('/api/render-status').then(st => {
    const pill = $('#renderState'); pill.hidden = false;
    if (st.state === 'running') {
      pill.className = 'pill on'; pill.textContent = st.total > 1 ? `Exporting… shot ${Math.min(st.done + 1, st.total - 1)}/${st.total - 1}` : 'Exporting…';
      if (st.done >= st.total - 1 && st.total > 1) pill.textContent = 'Exporting… adding text and music';
      setTimeout(pollRender, 700);
    } else {
      $('#export').disabled = false;
      if (st.state === 'done') {
        pill.className = 'pill on'; pill.textContent = 'Exported ✓';
        toast(`Saved to Reels\\${esc(st.file)} <button id="tPlay">Play</button><button id="tOpen">Show in folder</button>`, 12000);
        $('#tPlay').onclick = () => window.open('/reels/' + encodeURIComponent(st.file) + '?t=' + Date.now(), '_blank');
        $('#tOpen').onclick = () => api('/api/open-folder', {});
      } else if (st.state === 'error') { pill.className = 'pill'; pill.textContent = 'Export failed'; toast('Export failed: ' + esc(st.msg), 10000); }
    }
  }).catch(() => setTimeout(pollRender, 1500));
}

// ------------------------------------------------------------------ wiring
$('#play').onclick = toggle;
$('#prevF').onclick = () => { stop(); showFrame(S.frame - 1); };
$('#nextF').onclick = () => { stop(); showFrame(S.frame + 1); };
function jumpCut(dir) { stop(); const b = bounds(); const t = dir > 0 ? b.find(x => x > S.frame) : [...b].reverse().find(x => x < S.frame); if (t !== undefined) showFrame(Math.min(t, S.T.total - 1)); }
$('#prevCut').onclick = () => jumpCut(-1);
$('#nextCut').onclick = () => jumpCut(1);
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#splitT').onclick = split; $('#mergeT').onclick = mergeNext; $('#resetBeats').onclick = resetBeats;
$('#addText').onclick = addText; $('#resetText').onclick = resetText;
$('#zoom').addEventListener('input', e => { S.ppf = +e.target.value; renderTimeline(); });
$('#fitTl').onclick = () => { fitTimeline(); renderTimeline(); };
$('#kind').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LF.kind = b.dataset.v; LF.shown = 120; $('#kind').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderLib(); });
$('#pname').addEventListener('change', e => { const v = e.target.value.trim(); if (!v) { e.target.value = S.p.name; return; } pushHist(); S.p.name = v; markDirty(); });
$('#export').onclick = exportReel;
$('#proj').addEventListener('change', async e => {
  const v = e.target.value;
  if (v.startsWith('new:')) { const key = v.slice(4); await newProject(S.starters[key], S.templates[key].title + ' – new idea'); return; }
  await save(); const p = S.projects.find(x => x.id === v); if (p) openProject(p);
});
$('#dup').onclick = () => newProject(S.p, S.p.name + ' (copy)');
$('#del').onclick = async () => {
  if (!confirm(`Delete the project “${S.p.name}”?\n\nThis removes the editing project only. Videos you already exported stay in the Reels folder.`)) return;
  clearTimeout(saveT); await saving;
  await api('/api/project/delete', {id:S.p.id});
  S.projects = S.projects.filter(x => x.id !== S.p.id);
  if (S.projects.length) openProject(S.projects[0]); else { S.p = null; await newProject(S.starters.A, 'Reel A – new idea'); }
};
$('#q').addEventListener('input', e => { LF.q = e.target.value.trim(); LF.shown = 120; renderLib(); });
$('#loc').addEventListener('change', e => { LF.loc = e.target.value; LF.shown = 120; renderLib(); });
$('#colSel').addEventListener('change', e => { const v = e.target.value; if (v === '__add') addFolder(); else setCol(v); });
$('#orient').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; LF.orient = b.dataset.v; $('#orient').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderLib(); });
$('#tagChips').addEventListener('click', e => { const b = e.target.closest('[data-tag]'); if (!b) return; const t = b.dataset.tag; LF.tags.has(t) ? LF.tags.delete(t) : LF.tags.add(t); b.setAttribute('aria-pressed', LF.tags.has(t)); renderLib(); });
for (const id of ['fits', 'hideBad', 'usedOnly']) $('#' + id).addEventListener('click', e => { LF[id] = !LF[id]; e.currentTarget.setAttribute('aria-pressed', LF[id]); renderLib(); });
$('#libGrid').addEventListener('click', e => {
  if (e.target.id === 'libMore') { LF.shown += 120; renderLib(); return; }
  const card = e.target.closest('.card'); if (!card) return;
  const c = libList[+card.dataset.i];
  if (e.target.closest('.add')) { const k = S.sel; assignClip(c); toast(`Put in shot ${k + 1}`); return; }
  previewClip(c);
});
let warmT = 0;
$('#warm').onclick = async () => {
  const ids = libList.filter(c => !isPhoto(c)).map(c => c.id);
  if (!ids.length) { toast('Photos are always instant ✓'); return; }
  if (ids.length > 150 && !confirm(`Prepare previews for ${ids.length} clips? It runs in the background while you work and uses about ${Math.round(ids.length * 4 / 100) / 10} GB of disk space.`)) return;
  const r = await api('/api/warm', {ids});
  toast(r.queued ? `Preparing ${r.queued} previews in the background…` : 'These clips already have instant previews ✓');
  clearTimeout(warmT); warmStatus();
};
async function warmStatus() {
  let st; try { st = await api('/api/warm-status'); } catch (e) { return; }
  $('#warm').textContent = st.left ? `⚡ ${st.left} previews to go…` : '⚡ Instant previews';
  if (st.left) warmT = setTimeout(warmStatus, 3000);
}
$('#libGrid').addEventListener('dblclick', e => {
  const card = e.target.closest('.card'); if (!card || e.target.closest('.add')) return;
  assignClip(libList[+card.dataset.i]);
});
$('#libGrid').addEventListener('mousemove', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const c = libList[+card.dataset.i]; if (!c || c.n < 2) return;
  const r = card.getBoundingClientRect(), k = clamp(Math.floor((e.clientX - r.left) / r.width * c.n), 0, c.n - 1);
  const img = card.querySelector('img'); const u = thumbUrl(c, k); if (img.getAttribute('src') !== u) img.src = u;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#lookPop').hidden) { closeLookPop(); return; }
  if (e.key === 'Escape' && cvWrap.classList.contains('pseudo')) { setBig(false); return; }
  if (e.target.matches?.('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); }
  else if (k === 's' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); split(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? jumpCut(1) : (stop(), showFrame(S.frame + 1)); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? jumpCut(-1) : (stop(), showFrame(S.frame - 1)); }
  else if (k === 'f' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); toggleFs(); }
  else if (e.key === 'Enter' && S.selText && !e.target.closest?.('button')) { e.preventDefault(); openTextEditor(S.selText, 'canvas'); }
  else if (e.key === 'Escape' && !$('#clipWrap').hidden) setSideTab('orig');
  else if (e.key === 'Escape' && S.selText) { S.selText = null; renderTextTrack(); renderInspector(); paint(S.frame); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && S.selText) { e.preventDefault(); deleteText(S.selText); }
  else if (k === 't' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); addText(); }
  else if (e.key === ']') selectSlot(S.sel + 1);
  else if (e.key === '[') selectSlot(S.sel - 1);
});
window.addEventListener('resize', () => { if (S.p) renderTimeline(); });
window.addEventListener('beforeunload', () => { if (S.p) navigator.sendBeacon && fetch('/api/project', {method:'POST', keepalive:true, headers:{'Content-Type':'application/json'}, body:JSON.stringify(S.p)}); });

// an open page notices when Reel Studio has been updated (new page or new program) and offers to reload
(function watchUpdates() {
  let first = null;
  const check = async () => {
    try {
      const v = await (await fetch('/api/version', {cache: 'no-store'})).json(), key = v.page + ':' + v.code;
      if (first === null) { first = key; return; }
      if (key === first || $('#updBar')) return;
      const bar = document.createElement('div'); bar.id = 'updBar';
      bar.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:200;background:var(--accent);color:#000;padding:8px 14px;border-radius:8px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45)';
      bar.innerHTML = 'Reel Studio was updated with new features. <button id="updGo" style="margin-left:8px">Reload now</button>';
      document.body.appendChild(bar);
      $('#updGo').onclick = async () => { try { if (S.p) await save(); } catch (e) {} location.reload(); };
    } catch (e) {}
  };
  check(); setInterval(check, 15000);
})();
(async function boot() {
  try {
    const d = await api('/api/init');
    if (d.stale || !d.styles) {     // the page was updated but an older Reel Studio program is still running
      $('#busy').innerHTML = `<div style="max-width:520px;text-align:center;line-height:1.6;color:var(--ink)">
        <div style="font-size:20px;font-weight:700;margin-bottom:8px">Reel Studio was updated — please restart it</div>
        The old version is still running. Close the black <b>Reel Studio</b> window,
        then double-click <b>Start Reel Studio.bat</b> again.<br>
        <span style="color:var(--muted)">Your reels are saved. Nothing is lost.</span></div>`;
      return;
    }
    S.lib = d.library.filter(c => c.n > 0); S.lib.forEach(c => S.byId[c.id] = c); S.cols = d.collections || [];
    S.templates = d.templates; S.starters = d.starters; S.projects = d.projects; S.styles = d.styles;
    lookList = d.looks || []; lookList.forEach(L => LOOKS[L.key] = L);
    if (!S.projects.length) { showWelcome(); return; }        // a brand-new copy: ask for the first footage folder
    buildLibFilters(); warmStatus();
    let last = null; try { last = localStorage.getItem('rs-last'); } catch (e) {}
    const p = S.projects.find(x => x.id === last) || S.projects[0];
    openProject(p);
    $('#busy').remove();
  } catch (e) {
    console.error(e);
    const b = $('#busy');
    if (b) b.textContent = 'Could not load Reel Studio: ' + e.message + ' — try closing the black Reel Studio window and starting it again.';
  }
})();
